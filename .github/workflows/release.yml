name: Release

# Runs on every merge to main. Creates the tag v<version> and a GitHub release
# when the version in manifest.json has not been released yet.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check whether it is new
        id: version
        run: |
          version=$(jq -r .version custom_components/energy_assistant/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists, nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the changelog section
        if: steps.version.outputs.new == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::No section '## [$version]' with content in CHANGELOG.md."
            exit 1
          fi

      - name: Package the integration as a ZIP (for HACS)
        if: steps.version.outputs.new == 'true'
        run: |
          (cd custom_components/energy_assistant && zip -r "$GITHUB_WORKSPACE/energy_assistant.zip" . -x "__pycache__/*" "*.pyc")

      - name: Create tag and release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: energy_assistant.zip

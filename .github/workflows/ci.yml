name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prüfen, ob Tests und Abhängigkeiten vorhanden sind
        id: check
        run: |
          if [ -d tests ] && [ -f requirements_test.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Tests oder requirements_test.txt gefunden, übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.run == 'true'
        run: |
          pip install -r requirements_test.txt
          pytest
